name: Deploy K8S Infrastructure
on: 
  workflow_dispatch:
    inputs:
      skip-deploy-infra:
        description: 'Skip Deploy Infra?'
        type: boolean
        required: false
        default: false
      existing-master-node-ip:
        description: 'Existing Master Node IP (if skipping infra)'
        type: string
        required: false
        default: ''
      existing-worker-node-ip:
        description: 'Existing Worker Node IP (if skipping infra)'
        type: string
        required: false
        default: ''

jobs:
  deploy-infra:
    if: ${{ !inputs.skip-deploy-infra }}
    runs-on: ubuntu-latest
    outputs:
      master-node-ip: ${{ steps.master-node-ip.outputs.master-node-ip }}
      worker-node-ip: ${{ steps.worker-node-ip.outputs.worker-node-ip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Initialize Terraform
        run: terraform init

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Plan Terraform deployment
        run: terraform plan -out=tfplan

      - name: Apply Terraform deployment
        run: terraform apply -auto-approve tfplan

      - name: Master Node IP
        id: master-node-ip
        run: |
          MASTER_NODE_IP=$(terraform output -raw master_public_ip)
          echo "master-node-ip=$MASTER_NODE_IP" >> "$GITHUB_OUTPUT"

      - name: Worker Node IP
        id: worker-node-ip
        run: |
          WORKER_NODE_IP=$(terraform output -raw worker_public_ip)
          echo "worker-node-ip=$WORKER_NODE_IP" >> "$GITHUB_OUTPUT"

  Master-Node-Setup:
    runs-on: ubuntu-latest
    needs: deploy-infra
    if: always() && (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    outputs:
      join-command: ${{ steps.save-join-cmd.outputs.join-command }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Run Ansible Playbook for Master Node Setup
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          MASTER_NODE_IP="${{ inputs.existing-master-node-ip || needs.deploy-infra.outputs.master-node-ip }}"
          ansible-playbook -i "$MASTER_NODE_IP," --user ec2-user ansible/master_node_setup.yml

      - name: Save Join Command to Step & Job Output
        id: save-join-cmd
        env:
          MASTER_NODE_IP: ${{ inputs.existing-master-node-ip || needs.deploy-infra.outputs.master-node-ip }}
        run: |
          if [ -f /tmp/join_command.sh ]; then
            JOIN_CMD=$(cat /tmp/join_command.sh)
          else
            JOIN_CMD=$(ssh -o StrictHostKeyChecking=no ec2-user@$MASTER_NODE_IP "cat /home/ec2-user/join_command.sh")
          fi
          echo "join-command=$JOIN_CMD" >> "$GITHUB_OUTPUT"

  Worker-Node-Setup:
    runs-on: ubuntu-latest
    needs: [deploy-infra, Master-Node-Setup]
    if: always() && (needs.Master-Node-Setup.result == 'success') && (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Run Ansible Playbook for Worker Node Setup
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          WORKER_NODE_IP="${{ inputs.existing-worker-node-ip || needs.deploy-infra.outputs.worker-node-ip }}"
          JOIN_CMD="${{ needs.Master-Node-Setup.outputs.join-command }}"
          ansible-playbook -i "$WORKER_NODE_IP," --user ec2-user \
            --extra-vars "k8s_join_command='$JOIN_CMD'" \
            ansible/worker_node_setup.yml