---
- name: Set up Kubernetes Master Node
  hosts: all
  become: true
  vars:
    k8s_version: "1.30"
    pod_network_cidr: "10.244.0.0/16"

  tasks:
    - name: Disable swap immediately
      command: swapoff -a

    - name: Ensure swap is removed from /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'

    - name: Load required kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules across reboots
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Configure sysctl params for Kubernetes networking
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: Apply sysctl parameters without reboot
      command: sysctl --system

    - name: Install containerd and dependencies
      dnf:
        name:
          - containerd
          - iptables
        state: present

    - name: Ensure containerd config directory exists
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Generate default containerd configuration
      shell: containerd config default > /etc/containerd/config.toml

    - name: Set SystemdCgroup to true in containerd configuration
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Restart and enable containerd service
      systemd:
        name: containerd
        state: restarted
        enabled: true

    - name: Add official Kubernetes RPM repository
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/repodata/repomd.xml.key
          exclude=kubelet kubeadm kubectl cri-tools ebtables

    - name: Install kubelet, kubeadm, and kubectl
      dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_excludes: kubernetes

    - name: Enable and start kubelet service
      systemd:
        name: kubelet
        state: started
        enabled: true

    - name: Check if Kubernetes cluster is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadmin_conf

    - name: Initialize Kubernetes Control Plane with kubeadm
      command: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      when: not kubeadmin_conf.stat.exists

    - name: Create .kube directory for ec2-user
      file:
        path: /home/ec2-user/.kube
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Copy admin.conf to ec2-user kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ec2-user/.kube/config
        remote_src: true
        owner: ec2-user
        group: ec2-user
        mode: '0600'

    - name: Install Flannel CNI network plugin
      become: false
      command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config
      when: not kubeadmin_conf.stat.exists

    - name: Generate fresh worker join command
      command: kubeadm token create --print-join-command
      register: join_command_output

    - name: Save join command to a file on master
      copy:
        content: "{{ join_command_output.stdout }}"
        dest: /home/ec2-user/join_command.sh
        owner: ec2-user
        group: ec2-user
        mode: '0755'
    
    - name: Fetch join command to GitHub Actions runner
      fetch:
        src: /home/ec2-user/join_command.sh
        dest: /tmp/join_command.sh
        flat: true